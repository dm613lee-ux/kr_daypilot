[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kr-daypilot"
version = "0.1.0"
description = "KR DayPilot short-term Korean stock screening and backtesting tools"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "finance-datareader>=0.9.202,<1",
  "pykrx>=1.2.8,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
kr-daypilot-backtest = "kr_precision_backtest.run_backtest:main"
kr-daypilot-daily-pipeline = "kr_precision_backtest.daily_pipeline:main"
kr-daypilot-intraday-collect = "kr_precision_backtest.collect_intraday:main"
kr-daypilot-intraday-backtest = "kr_precision_backtest.run_intraday_backtest:main"
kr-daypilot-historical-intraday-backfill = "kr_precision_backtest.backfill_historical_intraday:main"
kr-daypilot-historical-intraday-backtest = "kr_precision_backtest.run_historical_intraday_backtest:main"
kr-daypilot-walk-forward-validation = "kr_precision_backtest.run_walk_forward_validation:main"
kr-daypilot-swing-backtest = "kr_precision_backtest.run_swing_backtest:main"
kr-daypilot-paper-plan = "kr_precision_backtest.run_paper_plan:main"
kr-daypilot-feature-stop-analysis = "kr_precision_backtest.run_feature_stop_analysis:main"
kr-daypilot-eod-context = "kr_precision_backtest.collect_eod_context:main"
kr-daypilot-krx-access = "kr_precision_backtest.diagnose_krx_access:main"
kr-daypilot-risk-context = "kr_precision_backtest.collect_risk_context:main"
kr-daypilot-risk-context-validate = "kr_precision_backtest.analyze_risk_context:main"
kr-daypilot-research-gate1 = "kr_precision_backtest.run_research_gate1:main"
kr-daypilot-research-gate2 = "kr_precision_backtest.run_research_gate2:main"
kr-daypilot-fundamentals = "kr_precision_backtest.collect_fundamentals:main"
kr-daypilot-price-refresh = "kr_precision_backtest.collect_price_history:main"
kr-daypilot-recommender-pipeline = "kr_precision_backtest.run_recommender_pipeline:main"
kr-daypilot-web = "kr_precision_backtest.run_web_app:main"
kr-daypilot-web-launch = "kr_precision_backtest.launch_web_app:main"
kr-daypilot-rg2-sensitivity = "kr_precision_backtest.run_rg2_sensitivity:main"
kr-daypilot-value-momentum-mvp = "kr_precision_backtest.run_value_momentum_mvp:main"
kr-daypilot-investment-recommender = "kr_precision_backtest.run_investment_recommender:main"
